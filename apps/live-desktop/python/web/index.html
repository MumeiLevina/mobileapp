<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mori Live — thử nghiệm</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/client.js"></script>
  </head>
  <body>
    <main>
      <h1>Mori Live</h1>
      <p id="status" role="status">
        Chưa kết nối. Chỉ nhập mã operator, không nhập API token.
      </p>
      <form id="login">
        <label
          >Mã operator
          <input
            id="token"
            type="password"
            autocomplete="off"
            required /></label
        ><button>Kết nối</button>
      </form>
      <section id="runtime" hidden>
        <p>
          Chế độ: <strong id="mode"></strong> · Âm thanh:
          <strong id="voice-mode"></strong>
        </p>
        <iframe
          id="avatar"
          title="Snow Neko"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
        <label><input type="checkbox" id="reduced" />Giảm chuyển động</label>
        <label
          >Âm lượng
          <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.6"
        /></label>
        <label
          >Thiết bị đầu ra
          <select id="device">
            <option value="">Mặc định hệ thống</option>
          </select></label
        >
        <form id="chat">
          <label
            >Tin nhắn mô phỏng
            <input id="text" maxlength="2000" required /></label
          ><button id="send" disabled>Gửi</button>
        </form>
        <button id="cancel" type="button">Dừng lượt</button>
        <p id="reply" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
